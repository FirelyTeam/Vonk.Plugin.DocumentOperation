# Repo: FirelyTeam/Vonk.Plugin.DocumentOperation
# File: build/azure-pipelines.yml
name: build-$(Date:yyyyMMdd)$(Rev:.r)
resources:
  repositories:
    - repository: templates
      type: github
      name: FirelyTeam/azure-pipeline-templates
      endpoint: FirelyTeam
      ref: refs/tags/v1

variables:
  - template: variables.yml  

pool: 
  vmImage: $(vmImage)

trigger:
  branches: 
    include:
    - develop
    - release/*
    - hotfix/*
    - refs/tags/v*

stages:
- stage: build
  jobs:
  - template: build.yml@templates  # Template reference
    parameters:
      dotNetCoreVersion: $(DOTNET_CORE_SDK)
      propsFile: 'Vonk.Plugin.DocumentOperation.props'
      ${{ if not(startswith(variables['Build.SourceBranch'], 'refs/tags/v')) }}:  # 'normal' build 
        useVersionSuffix: true
      ${{ else }}:  # release mode 
        useVersionSuffix: false
      nuGetServiceConnections: GitHub_FirelyTeams_NuGetFeed
      nuGetSources: --source https://nuget.pkg.github.com/FirelyTeam/index.json
      packageArtifacts: false
      publishArtifacts: false
      pool: 
        vmImage: $(vmImage)
    
  - template: publish-plugin.yml@templates  # Template reference
    parameters:
      restoreDependencies: true
      nuGetServiceConnections: GitHub_FirelyTeams_NuGetFeed
      nuGetSources: --source https://nuget.pkg.github.com/FirelyTeam/index.json
      dotNetCoreVersion: $(DOTNET_CORE_SDK)
      pool:
          vmImage: $(vmImage)

- stage: deploy
  dependsOn: build
  displayName: Deploy
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest')) # not a PR
  jobs:
  - template: deploy-plugin.yml@templates
    parameters:
      packageName: 'vonk.plugin.documentoperation'
      packageDescription: 'Vonk Plugin implementing FHIR `$document` operation'
      pool:
        vmImage: $(vmImage)            
